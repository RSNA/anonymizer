[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsna-anonymizer"
version = "19.1.0.dev1"
description = "RSNA DICOM Anonymizer"
readme = "readme.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Algorhythm Software", email = "michael@dx.life" }]
requires-python = ">=3.11.0,<3.15.0"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "customtkinter",
    "pillow",
    "tkhtmlview",
    "pydicom>=3.0,<4",
    "pynetdicom>=3.0",
    "ifaddr",
    "boto3",
    "openpyxl",
    "psutil",
    "pylibjpeg[all]",
    "pylibjpeg-openjpeg>=2.5.0",
    "pylibjpeg-libjpeg>=2.4.0",
    "pylibjpeg-rle>=2.2.0",
    "opencv-python-headless",
    "easyocr",
    "torch",
    "torchvision",
    "cryptography",
    "requests",
    "requests-oauthlib",
    "certifi",
    "toml>=0.10.2",
    "click>=8.1.8",
    "dataclasses-json>=0.6.7",
    "bidict>=0.23.1",
    "sqlalchemy>=2.0.38",
    "simpleitk>=2.5.5",
    "scipy",
    "totalsegmentator>=2.3.0",
    "xgboost>=2.0.0",
    "nibabel",
    "dicom2nifti>=2.6",
    "tkinterdnd2>=0.6.3",
]

[project.scripts]
rsna-anonymizer = "anonymizer.anonymizer:main"

[project.urls]
Homepage = "https://github.com/RSNA/anonymizer"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "black",
    "pytest",
    "pytest-cov>=6.0.0",
    "python-dotenv",
    "ffmpeg-python>=0.2.0",
    "pytest-mock>=3.14.1",
    "watchfiles>=1.0.0",
    "setuptools>=70,<82",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
]
prototyping-viz = [
    "matplotlib>=3.8.0",
    "scikit-image>=0.22.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "SIM",
    "C90",
]
fixable = [
    "I001",
    "W292",
    "W293",
    "W291",
    "F401",
]
ignore = [
    "E501",
    "SIM102",
    "C901",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests/controller", "tests/view", "tests/model", "tests/mcp"]
addopts = "--verbose --cov=src/anonymizer/controller --cov=src/anonymizer/utils --cov=src/anonymizer/model --cov=src/anonymizer/mcp -m \"not ocr_integration and not view_dev and not dicom_integration\""
pythonpath = ["src", "."]
filterwarnings = []
markers = [
    "tseg_integration: run TotalSegmentator inference (slow, optional)",
    "ocr_integration: EasyOCR on real burnt-in PHI fixtures under tests/controller/ocr (opt-in; excluded from default)",
    "dicom_integration: local Orthanc PACS or heavy DICOM network integration (skipped in CI; excluded from default)",
    "rsna_local_data: requires local RSNA_TEST_DATA directory (skipped when absent)",
    "view_dev: local Series View layout tests against developer MRI_TEST fixtures (excluded from CI)",
    "prototyping: tests for src/prototyping scripts",
]
