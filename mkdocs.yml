site_name: RSNA DICOM Anonymizer
site_description: Clinician user manual for the RSNA DICOM Anonymizer (V19)
site_url: https://rsna.github.io/anonymizer/
repo_url: https://github.com/RSNA/anonymizer
repo_name: RSNA/anonymizer
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  logo: assets/rsna_icon.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.media
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Start
            Setup: Einrichtung
            Use: Nutzung
            Headless: Ohne Oberfläche
            Reference: Referenz
            1. Start here: 1. Hier beginnen
            2. Install: 2. Installation
            3. AI Features: 3. KI-Funktionen
            4. Words we use: 4. Begriffe
            5. Create a project: 5. Projekt anlegen
            6. Search: 6. Suchen
            7. View: 7. Ansicht
            8. Process: 8. Verarbeiten
            8.1 Pixel PHI: 8.1 Pixel-PHI
            8.2 Harmonize: 8.2 Harmonisieren
            8.3 Blur faces: 8.3 Gesichter unscharf
            8.4 Batch: 8.4 Stapel
            9. Send: 9. Senden
            De-identification protocol: De-Identifikationsprotokoll
            DICOM Conformance Statement: DICOM-Konformitätserklärung
            Troubleshooting: Fehlerbehebung
            License: Lizenz
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Setup: Configuración
            Use: Uso
            Headless: Sin interfaz
            Reference: Referencia
            1. Start here: 1. Empezar aquí
            2. Install: 2. Instalación
            3. AI Features: 3. Funciones de IA
            4. Words we use: 4. Palabras que usamos
            5. Create a project: 5. Crear un proyecto
            6. Search: 6. Buscar
            7. View: 7. Vista
            8. Process: 8. Procesar
            8.1 Pixel PHI: 8.1 PHI en píxeles
            8.2 Harmonize: 8.2 Armonizar
            8.3 Blur faces: 8.3 Desenfocar caras
            8.4 Batch: 8.4 Lote
            9. Send: 9. Enviar
            De-identification protocol: Protocolo de desidentificación
            DICOM Conformance Statement: Declaración de conformidad DICOM
            Troubleshooting: Solución de problemas
            License: Licencia
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Setup: Configuration
            Use: Utilisation
            Headless: Sans interface
            Reference: Référence
            1. Start here: 1. Commencer ici
            2. Install: 2. Installation
            3. AI Features: 3. Fonctions IA
            4. Words we use: 4. Mots que nous utilisons
            5. Create a project: 5. Créer un projet
            6. Search: 6. Rechercher
            7. View: 7. Vue
            8. Process: 8. Traiter
            8.1 Pixel PHI: 8.1 PHI pixel
            8.2 Harmonize: 8.2 Harmoniser
            8.3 Blur faces: 8.3 Flouter les visages
            8.4 Batch: 8.4 Lot
            9. Send: 9. Envoyer
            De-identification protocol: Protocole de désidentification
            DICOM Conformance Statement: Déclaration de conformité DICOM
            Troubleshooting: Dépannage
            License: Licence

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/os_shots.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RSNA/anonymizer

exclude_docs: |
  README.md
  _legacy_html/**
  tutorials/**
  **/tutorials/**
  **/shots/.gitkeep

nav:
  - Home: index.md
  - Setup:
      - 1. Start here: 01-start-here/index.md
      - 2. Install: 02-install/index.md
      - 3. AI Features: 03-ai-features-setup/index.md
      - 4. Words we use: 04-words-we-use/index.md
      - 5. Create a project: 05-create-project/index.md
  - Use:
      - 6. Search: 06-search/index.md
      - 7. View: 07-view/index.md
      - 8. Process:
          - 08-process/index.md
          - 8.1 Pixel PHI: 08-process/02-remove-burned-in-text/index.md
          - 8.2 Harmonize: 08-process/03-harmonize-names/index.md
          - 8.3 Blur faces: 08-process/04-blur-faces/index.md
          - 8.4 Batch: 08-process/05-run-on-many-studies/index.md
      - 9. Send: 09-send/index.md
  - Headless: 10-headless/index.md
  - Reference:
      - De-identification protocol: deidentification-protocol.md
      - DICOM Conformance Statement: dicom-conformance-statement.md
      - Troubleshooting: troubleshooting.md
      - License: license.md
