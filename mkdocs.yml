            8. Process: 8. Traiter
            8.1 Remove Pixel PHI: 8.1 Supprimer le texte incrusté
            8.2 Harmonize names: 8.2 Harmoniser les noms
            8.3 Blur faces: 8.3 Flouter les visages
            8.4 Run on many studies: 8.4 Exécuter sur plusieurs études
            9. Send: 9. Envoyer
            10. Run headless: 10. Exécution sans interface
            Reference: Référence
            De-identification protocol: Protocole de désidentification
            Troubleshooting: Dépannage
            Tutorials: Tutoriels
