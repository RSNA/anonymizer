      - id: SeriesView_Review
        file: SeriesView_Review.png
        window: SeriesView
        severity: required
        deps: [project, fixture:davidson_cxr]
        ux_elements: [Image viewport, Frame navigator, Toolbar]
        caption: "Series View reviewing davidson_cxr (before Process tools)."
