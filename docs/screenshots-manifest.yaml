        file: MetadataAssessment.png
        window: MetadataAssessmentDialog
        severity: soft
        deps: [project, fixture:davidson_cxr]
        recipe:
          mode: tree
        ux_elements:
          - Field Name / Tag / Content tree
          - Search
          - Private tags
          - Expand
          - Collapse
          - Detect PHI
          - Close
        caption: "Series View Metadata — DICOM tag tree for the current davidson_cxr image (Private tags on)."
      - id: MetadataAssessment_DetectPHI
        file: MetadataAssessment_DetectPHI.png
        window: MetadataAssessmentDialog
        severity: soft
        deps: [project, fixture:davidson_cxr, ocr_models]
        recipe:
          mode: detect
        ux_elements:
          - Highlighted PHI cells
          - Entity color chips
          - Detection status
          - Private tags
          - Remove PHI / Blank (when PHI found)
        caption: "Metadata after Detect PHI — leftover identifiers highlighted; Remove PHI can rewrite tags after Save."
      - id: MetadataAssessment_RemovePHI
        file: MetadataAssessment_RemovePHI.png
        window: MetadataAssessmentDialog
        severity: soft
        deps: [project, fixture:davidson_cxr, ocr_models]
        recipe:
          mode: remove
        ux_elements:
          - Cleaned Content cells
          - Status after remove
