      - id: Dashboard_Analytics
        file: Dashboard_Analytics.png
        window: Dashboard
        severity: soft
        deps:
          - project
          - imported
          - fixture:CT_Head_With_Contrast
          - fixture:davidson_cxr
          - fixture:us_rgb_single_frame
        recipe:
          action: expand_analytics
          min_widgets: 10
          seed_tseg: true
        ux_elements:
          - Analytics expand
          - Show
          - Volumes
          - Bin width
          - Refresh
          - Demographic tiles (sex age modality ethnicity AI)
          - Organ volume histograms (≥10 board widgets total)
        caption: "Dashboard Analytics expanded with demographic tiles and multiple organ-volume charts (≥10 widgets)."
      - id: ViewProjections
        file: ViewProjections.png
        window: ProjectionView
        severity: required
        deps: [project, imported, fixture:CT_Head_With_Contrast]
        ux_elements: [Projection thumbnails, Study title, Open Series View from tile, S M L]
        caption: "View Projections for a selected study (right-click study or toolbar button)."
      - id: ViewProjections_Multi
