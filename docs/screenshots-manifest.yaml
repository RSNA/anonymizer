        ux_elements: [Green imported row, Imported count, Move Level STUDY]
        caption: "Doe^Archibald CT study import complete — green row and Imported count."

  - id: 07-view
    doc: 07-view/index.md
    chapter: "7"
    title: View
    shots_dir: shots
    shots:
      - id: Dataset
        file: Dataset.png
        window: DatasetView
        severity: required
        deps: [project, imported, fixture:davidson_cxr, fixture:CT_Head_With_Contrast, fixture:us_rgb_single_frame]
        ux_elements:
          - Study/Series tree
          - AI status columns
          - View Projections
          - Description Mappings
          - AI Batch Process
