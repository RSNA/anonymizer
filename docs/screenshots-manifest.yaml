# Full capture (all languages, resume-safe):
#   uv run python -m docs_help -v
# Languages (in order): en_US → de → es → fr
# One language:         uv run python -m docs_help --language de -v
# Existing PNGs are skipped; work under docs/.capture_work/<lang> is kept.
# Shared TSEG/OCR cache: docs/.capture_work/fixture_cache/ (+ docs_help/ocr_cache/)
# Reset language work:   --reset-work   Recapture PNGs: --force
#
# Shot order = MkDocs nav chapter numbers (not folder names):
#   2 Install → 3 AI Features → 5 Create a project → 6 Search → 7 View
#   → 8.1 Remove Pixel PHI → 8.2 Harmonize names → 8.3 Blur faces
#   → 8.4 Run on many studies → 9 Send
#

fixtures:
  test_dcm_files: tests/controller/assets/test_dcm_files
  davidson_cxr: tests/controller/assets/test_dcm_files/davidson_cxr
  CT_Head_With_Contrast: tests/controller/assets/test_dcm_files/CT_Head_With_Contrast
  us_rgb_single_frame: tests/controller/assets/test_dcm_files/us_rgb_single_frame
  demo_report_pdf: tests/controller/assets/test_dcm_files/demo_report_pdf
  ctp_lookup: tests/controller/assets/ctp_lookup/test_dcm_files_lookup.properties

languages:
  en_US: en
  de: de
  es: es
  fr: fr

orthanc:
  host: 127.0.0.1
  port: 4242
  aet: ORTHANC

workflows:
  - id: 02-install
    doc: 02-install/index.md
    chapter: "2"
    title: Install and first launch
    shots_dir: shots
    shots:
      - id: Welcome
        file: Welcome.png
        window: WelcomeView
        severity: required
        deps: [language]
        ux_elements: [Welcome screen, Language selector, New Project / Open / AI Features]
        caption: "Welcome screen after first launch."

  - id: 03-ai-features-setup
    doc: 03-ai-features-setup/index.md
    chapter: "3"
    title: "AI Features setup"
    shots_dir: shots
    shots:
      - id: AiFeaturesSetup
        file: AiFeaturesSetup.png
        window: AiFeaturesSetupDialog
        severity: required
        deps: [language]
        ux_elements: [Download rows, Harmonize resolution, License]
        caption: "AI Features setup — download models before Process tool demos."

  - id: 05-create-project
    doc: 05-create-project/index.md
    chapter: "5"
    title: Create a project
    shots_dir: shots
    shots:
      - id: NewProjectSettings
        file: NewProjectSettings.png
        window: SettingsDialog
        severity: required
        deps: [language, temp_storage]
        ux_elements:
          - Project Name
          - Storage Directory
          - Site ID / UID Root
          - Local Server / Query Server / Export Server buttons
