name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group dev --locked --python ${{ matrix.python-version }}

    - name: Minimize uv cache
      if: always()
      run: uv cache prune --ci

    - name: Ruff Linting Check
      run: uv run --python ${{ matrix.python-version }} ruff check ./src/anonymizer/

    - name: Run Unit Tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
        AWS_PASSWORD: ${{ secrets.AWS_PASSWORD }}
        CI: "true"
      run: uv run --python ${{ matrix.python-version }} pytest

  changes:
    runs-on: ubuntu-latest
    outputs:
      dicom: ${{ steps.filter.outputs.dicom }}
      force: ${{ steps.force.outputs.run }}
    steps:
    - uses: actions/checkout@v5
    - name: Force Orthanc on dispatch or protected branches
      id: force
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.ref }}" = "refs/heads/dev" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          dicom:
            - 'src/anonymizer/controller/dicom/**'
            - 'tests/controller/dicom/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - '.github/workflows/tests.yaml'

  dicom-integration:
    needs: changes
    if: needs.changes.outputs.dicom == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --group dev --locked --python 3.12

    - name: Cache managed Orthanc binaries
      uses: actions/cache@v5
      with:
        path: tests/controller/dicom/support/orthanc_runtime
        key: orthanc-${{ runner.os }}-1.12.7-dicomweb-1.18-gdcm-1.8

    - name: Run Orthanc DICOM integration tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        CI: "true"
      run: >
        uv run --python 3.12 pytest -m dicom_integration
        -o 'addopts=--tb=short'
