name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group dev --locked --python ${{ matrix.python-version }}

    - name: Minimize uv cache
      if: always()
      run: uv cache prune --ci

    - name: Ruff Linting Check
      run: uv run --python ${{ matrix.python-version }} ruff check ./src/anonymizer/

    - name: Cache managed Orthanc binaries
      uses: actions/cache@v4
      with:
        path: tests/controller/dicom/support/orthanc_runtime
        key: orthanc-${{ runner.os }}-1.12.7-dicomweb-1.18-gdcm-1.8

    - name: Run Unit Tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
        AWS_PASSWORD: ${{ secrets.AWS_PASSWORD }}
        CI: "true"
      run: uv run --python ${{ matrix.python-version }} pytest
